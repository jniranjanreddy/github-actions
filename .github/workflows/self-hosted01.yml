name: kubectl test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: [self-hosted, ubuntu24]
    steps:
      - name: Setup kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Test cluster
        run: kubectl get pods -A
